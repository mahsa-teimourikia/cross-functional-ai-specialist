<polyline points="1712,330 1752,330" fill="none" stroke="#2F6BFF" stroke-width="2.5" marker-end="url(#arrow-primary)" stroke-linejoin="round"/>
<rect x="72" y="270" width="170" height="120" rx="14" fill="#FFFFFF" stroke="#52606D" stroke-width="2"/>
<text x="157.0" y="324.0" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600" fill="#16324F">Authorized</text>
<text x="157.0" y="346.0" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600" fill="#16324F">source</text>
<rect x="282" y="270" width="170" height="120" rx="14" fill="#E5F7F6" stroke="#16A3A5" stroke-width="2"/>
<text x="367.0" y="324.0" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600" fill="#16324F">Versioned</text>
<text x="367.0" y="346.0" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600" fill="#16324F">manifest</text>
<rect x="492" y="250" width="170" height="160" rx="14" fill="#E5F7F6" stroke="#16A3A5" stroke-width="2"/>
