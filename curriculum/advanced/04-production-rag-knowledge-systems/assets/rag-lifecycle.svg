<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="660" viewBox="0 0 2000 660" role="img" aria-labelledby="title desc">
<title id="title">Production RAG write and read lifecycle</title>
<desc id="desc">An authorized source becomes a versioned manifest, parsed chunks with provenance and access controls, and a current index. A trusted principal and query authorize current chunks before retrieval, fusion, claim generation, citation validation, and an answer or refusal.</desc>
<defs>
<marker id="arrow-primary" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#2F6BFF"/></marker>
<marker id="arrow-secondary" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#52606D"/></marker>
</defs>
<rect width="2000" height="660" fill="#F7F9FC"/>
<text x="64" y="64" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700" fill="#16324F">Production RAG write and read lifecycle</text>
<text x="64" y="96" font-family="Inter, Arial, sans-serif" font-size="16" fill="#52606D">Connect governed ingestion to authorization-first retrieval and citation revalidation.</text>
