<text x="787.0" y="346.0" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600" fill="#16324F">embedded index</text>
<rect x="912" y="240" width="170" height="180" rx="14" fill="#FFF1DF" stroke="#F59E42" stroke-width="2"/>
