<text x="1417.0" y="335.0" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600" fill="#16324F">Fuse and rerank</text>
<rect x="1542" y="270" width="170" height="120" rx="14" fill="#F0EEFF" stroke="#7667E8" stroke-width="2"/>
<text x="1627.0" y="335.0" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600" fill="#16324F">Proposed claims</text>
<rect x="1752" y="250" width="170" height="160" rx="14" fill="#FFF1DF" stroke="#F59E42" stroke-width="2"/>
<text x="1837.0" y="302.0" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600" fill="#16324F">Revalidate</text>
<text x="1837.0" y="324.0" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600" fill="#16324F">citations then</text>
<text x="1837.0" y="346.0" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600" fill="#16324F">answer or</text>
