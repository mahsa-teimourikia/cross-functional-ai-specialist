<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="760" viewBox="0 0 2000 760" role="img" aria-labelledby="title desc">
<title id="title">Trusted application boundary</title>
<desc id="desc">Untrusted input passes through strict validation while authenticated state becomes a trusted principal. Both enter the application service, which calls authorized retrieval and generation before trusted result validation produces an answer, refusal, or typed failure.</desc>
<defs>
<marker id="arrow-primary" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#2F6BFF"/></marker>
<marker id="arrow-secondary" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#52606D"/></marker>
</defs>
<rect width="2000" height="760" fill="#F7F9FC"/>
<text x="64" y="64" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700" fill="#16324F">Trusted application boundary</text>
<text x="64" y="96" font-family="Inter, Arial, sans-serif" font-size="16" fill="#52606D">Show how trusted identity and validated input converge before retrieval, generation, and result validation.</text>
<polyline points="262,280 310,280" fill="none" stroke="#2F6BFF" stroke-width="2.5" marker-end="url(#arrow-primary)" stroke-linejoin="round"/>
<polyline points="262,520 310,520" fill="none" stroke="#2F6BFF" stroke-width="2.5" marker-end="url(#arrow-primary)" stroke-linejoin="round"/>
<polyline points="500,280 650,280 650,328 786,328" fill="none" stroke="#2F6BFF" stroke-width="2.5" marker-end="url(#arrow-primary)" stroke-linejoin="round"/>
<polyline points="500,520 650,520 650,392 786,392" fill="none" stroke="#2F6BFF" stroke-width="2.5" marker-end="url(#arrow-primary)" stroke-linejoin="round"/>
<polyline points="976,328 992,328 992,275 1024,275" fill="none" stroke="#2F6BFF" stroke-width="2.5" marker-end="url(#arrow-primary)" stroke-linejoin="round"/>
<polyline points="976,392 992,392 992,495 1024,495" fill="none" stroke="#2F6BFF" stroke-width="2.5" marker-end="url(#arrow-primary)" stroke-linejoin="round"/>
<polyline points="1214,275 1238,275 1238,362 1262,362" fill="none" stroke="#2F6BFF" stroke-width="2.5" marker-end="url(#arrow-primary)" stroke-linejoin="round"/>
<polyline points="1214,495 1238,495 1238,418 1262,418" fill="none" stroke="#2F6BFF" stroke-width="2.5" marker-end="url(#arrow-primary)" stroke-linejoin="round"/>
<polyline points="1472,390 1560,390" fill="none" stroke="#2F6BFF" stroke-width="2.5" marker-end="url(#arrow-primary)" stroke-linejoin="round"/>
<rect x="72" y="230" width="190" height="100" rx="14" fill="#FFFFFF" stroke="#52606D" stroke-width="2"/>
<text x="167.0" y="285.0" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600" fill="#16324F">Untrusted payload</text>
<rect x="310" y="230" width="190" height="100" rx="14" fill="#EAF1FF" stroke="#2F6BFF" stroke-width="2"/>
<text x="405.0" y="274.0" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600" fill="#16324F">Strict boundary</text>
<text x="405.0" y="296.0" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600" fill="#16324F">model</text>
<rect x="72" y="470" width="190" height="100" rx="14" fill="#FFFFFF" stroke="#52606D" stroke-width="2"/>
<text x="167.0" y="514.0" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600" fill="#16324F">Authenticated</text>
<text x="167.0" y="536.0" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600" fill="#16324F">state</text>
<rect x="310" y="470" width="190" height="100" rx="14" fill="#E5F7F6" stroke="#16A3A5" stroke-width="2"/>
<text x="405.0" y="525.0" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600" fill="#16324F">Trusted principal</text>
<rect x="786" y="280" width="190" height="160" rx="14" fill="#EAF1FF" stroke="#2F6BFF" stroke-width="2"/>
<text x="881.0" y="354.0" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600" fill="#16324F">Application</text>
<text x="881.0" y="376.0" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600" fill="#16324F">service</text>
<rect x="1024" y="220" width="190" height="110" rx="14" fill="#E5F7F6" stroke="#16A3A5" stroke-width="2"/>
<text x="1119.0" y="269.0" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600" fill="#16324F">Authorized</text>
<text x="1119.0" y="291.0" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600" fill="#16324F">retriever</text>
<rect x="1024" y="440" width="190" height="110" rx="14" fill="#F0EEFF" stroke="#7667E8" stroke-width="2"/>
<text x="1119.0" y="500.0" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600" fill="#16324F">Generator</text>
<rect x="1262" y="320" width="210" height="140" rx="14" fill="#FFF1DF" stroke="#F59E42" stroke-width="2"/>
<text x="1367.0" y="384.0" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600" fill="#16324F">Trusted result</text>
<text x="1367.0" y="406.0" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600" fill="#16324F">validator</text>
<rect x="1560" y="340" width="260" height="100" rx="14" fill="#EAF1FF" stroke="#2F6BFF" stroke-width="2"/>
<text x="1690.0" y="384.0" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600" fill="#16324F">Answer, refusal, or typed</text>
<text x="1690.0" y="406.0" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600" fill="#16324F">failure</text>
</svg>
