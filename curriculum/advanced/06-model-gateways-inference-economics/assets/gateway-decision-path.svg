<text x="1874.0" y="324.0" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600" fill="#16324F">Acceptance or</text>
<text x="1874.0" y="346.0" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600" fill="#16324F">fallback decision</text>
