<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="820" viewBox="0 0 2000 820" role="img" aria-labelledby="title desc">
<title id="title">Bounded agent control loop</title>
<desc id="desc">An authenticated request creates a bounded run. A model proposes a typed action, which trusted code validates, authorizes, and budgets before a narrow tool executes. The application verifies the result, checkpoints state, and either stops, loops for another proposal, or pauses for a bound approval that returns to validation.</desc>
<defs>
<marker id="arrow-primary" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#2F6BFF"/></marker>
<marker id="arrow-secondary" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#52606D"/></marker>
</defs>
<rect width="2000" height="820" fill="#F7F9FC"/>
<text x="64" y="64" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700" fill="#16324F">Bounded agent control loop</text>
<text x="64" y="96" font-family="Inter, Arial, sans-serif" font-size="16" fill="#52606D">Separate model action proposals from trusted validation, authorization, execution, checkpointing, approval, and termination.</text>
<polyline points="262,295 310,295" fill="none" stroke="#2F6BFF" stroke-width="2.5" marker-end="url(#arrow-primary)" stroke-linejoin="round"/>
<polyline points="500,295 548,295" fill="none" stroke="#2F6BFF" stroke-width="2.5" marker-end="url(#arrow-primary)" stroke-linejoin="round"/>
<polyline points="738,295 786,295" fill="none" stroke="#2F6BFF" stroke-width="2.5" marker-end="url(#arrow-primary)" stroke-linejoin="round"/>
<polyline points="976,295 1024,295" fill="none" stroke="#2F6BFF" stroke-width="2.5" marker-end="url(#arrow-primary)" stroke-linejoin="round"/>
<polyline points="1214,295 1262,295" fill="none" stroke="#2F6BFF" stroke-width="2.5" marker-end="url(#arrow-primary)" stroke-linejoin="round"/>
<polyline points="1452,295 1500,295" fill="none" stroke="#2F6BFF" stroke-width="2.5" marker-end="url(#arrow-primary)" stroke-linejoin="round"/>
<polyline points="1690,295 1738,295" fill="none" stroke="#2F6BFF" stroke-width="2.5" marker-end="url(#arrow-primary)" stroke-linejoin="round"/>
<text x="1714.0" y="283.0" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" fill="#334155">yes</text>
<polyline points="1566,240 1566,170 643,170 643,240" fill="none" stroke="#52606D" stroke-width="2.5" stroke-dasharray="8 7" marker-end="url(#arrow-secondary)" stroke-linejoin="round"/>
<text x="1104.5" y="158.0" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" fill="#334155">no: next action</text>
<polyline points="1595,350 1595,460 1550,460 1550,520" fill="none" stroke="#52606D" stroke-width="2.5" stroke-dasharray="8 7" marker-end="url(#arrow-secondary)" stroke-linejoin="round"/>
<text x="1572.5" y="448.0" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" fill="#334155">approval required</text>
<polyline points="1430,575 881,575 881,360" fill="none" stroke="#52606D" stroke-width="2.5" stroke-dasharray="8 7" marker-end="url(#arrow-secondary)" stroke-linejoin="round"/>
<text x="1155.5" y="563.0" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" fill="#334155">bound receipt</text>
<rect x="72" y="240" width="190" height="110" rx="14" fill="#FFFFFF" stroke="#52606D" stroke-width="2"/>
<text x="167.0" y="289.0" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600" fill="#16324F">Authenticated</text>
<text x="167.0" y="311.0" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600" fill="#16324F">request</text>
<rect x="310" y="240" width="190" height="110" rx="14" fill="#EAF1FF" stroke="#2F6BFF" stroke-width="2"/>
<text x="405.0" y="289.0" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600" fill="#16324F">Create bounded</text>
<text x="405.0" y="311.0" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600" fill="#16324F">run</text>
<rect x="548" y="240" width="190" height="110" rx="14" fill="#F0EEFF" stroke="#7667E8" stroke-width="2"/>
<text x="643.0" y="289.0" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600" fill="#16324F">Model proposes</text>
<text x="643.0" y="311.0" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600" fill="#16324F">typed action</text>
<rect x="786" y="230" width="190" height="130" rx="14" fill="#FFF1DF" stroke="#F59E42" stroke-width="2"/>
<text x="881.0" y="278.0" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600" fill="#16324F">Validate,</text>
<text x="881.0" y="300.0" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600" fill="#16324F">authorize,</text>
<text x="881.0" y="322.0" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600" fill="#16324F">reserve budget</text>
<rect x="1024" y="240" width="190" height="110" rx="14" fill="#EAF1FF" stroke="#2F6BFF" stroke-width="2"/>
<text x="1119.0" y="289.0" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600" fill="#16324F">Execute narrow</text>
<text x="1119.0" y="311.0" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600" fill="#16324F">tool</text>
<rect x="1262" y="230" width="190" height="130" rx="14" fill="#E5F7F6" stroke="#16A3A5" stroke-width="2"/>
<text x="1357.0" y="278.0" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600" fill="#16324F">Verify,</text>
<text x="1357.0" y="300.0" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600" fill="#16324F">reconcile,</text>
<text x="1357.0" y="322.0" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600" fill="#16324F">checkpoint</text>
<rect x="1500" y="240" width="190" height="110" rx="14" fill="#FFF1DF" stroke="#F59E42" stroke-width="2"/>
<text x="1595.0" y="289.0" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600" fill="#16324F">Trusted stop</text>
<text x="1595.0" y="311.0" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600" fill="#16324F">condition</text>
<rect x="1738" y="230" width="190" height="130" rx="14" fill="#EAF1FF" stroke="#2F6BFF" stroke-width="2"/>
<text x="1833.0" y="289.0" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600" fill="#16324F">Application-owned</text>
<text x="1833.0" y="311.0" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600" fill="#16324F">terminal state</text>
<rect x="1430" y="520" width="240" height="110" rx="14" fill="#FFF1DF" stroke="#F59E42" stroke-width="2"/>
<text x="1550.0" y="569.0" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600" fill="#16324F">Pause for bound</text>
<text x="1550.0" y="591.0" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600" fill="#16324F">approval</text>
</svg>
