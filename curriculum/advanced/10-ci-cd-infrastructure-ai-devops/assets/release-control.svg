<svg xmlns="http://www.w3.org/2000/svg" width="2300" height="660" viewBox="0 0 2300 660" role="img" aria-labelledby="title desc">
<title id="title">Evidence-bound AI release control</title>
<desc id="desc">A source revision is built into immutable artifacts and a release manifest. Evidence admission, an OIDC-scoped deployment capability, and reviewed infrastructure as code precede a canary. The controller then promotes the release or executes a known-good rollback.</desc>
<defs>
<marker id="arrow-primary" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#2F6BFF"/></marker>
<marker id="arrow-secondary" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#52606D"/></marker>
</defs>
<rect width="2300" height="660" fill="#F7F9FC"/>
<text x="64" y="64" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700" fill="#16324F">Evidence-bound AI release control</text>
<text x="64" y="96" font-family="Inter, Arial, sans-serif" font-size="16" fill="#52606D">Show how immutable artifacts, evidence, identity, reviewed infrastructure, canaries, and rollback constrain deployment.</text>
