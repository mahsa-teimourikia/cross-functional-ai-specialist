<text x="894.0" y="324.0" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600" fill="#16324F">Digest-bound</text>
<text x="894.0" y="346.0" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600" fill="#16324F">release manifest</text>
<rect x="1044" y="270" width="190" height="120" rx="14" fill="#FFF1DF" stroke="#F59E42" stroke-width="2"/>
