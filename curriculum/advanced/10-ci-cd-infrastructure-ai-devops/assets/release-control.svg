<polyline points="1724,330 1779,330" fill="none" stroke="#2F6BFF" stroke-width="2.5" marker-end="url(#arrow-primary)" stroke-linejoin="round"/>
<polyline points="1969,330 2024,330" fill="none" stroke="#2F6BFF" stroke-width="2.5" marker-end="url(#arrow-primary)" stroke-linejoin="round"/>
<rect x="64" y="270" width="190" height="120" rx="14" fill="#FFFFFF" stroke="#52606D" stroke-width="2"/>
<text x="159.0" y="335.0" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600" fill="#16324F">Source revision</text>
<rect x="309" y="270" width="190" height="120" rx="14" fill="#EAF1FF" stroke="#2F6BFF" stroke-width="2"/>
<text x="404.0" y="335.0" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600" fill="#16324F">Isolated build</text>
<rect x="554" y="240" width="190" height="180" rx="14" fill="#E5F7F6" stroke="#16A3A5" stroke-width="2"/>
<text x="649.0" y="302.0" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600" fill="#16324F">Immutable code,</text>
<text x="649.0" y="324.0" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600" fill="#16324F">model, prompt,</text>
<text x="649.0" y="346.0" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600" fill="#16324F">policy, and IaC</text>
<text x="649.0" y="368.0" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600" fill="#16324F">artifacts</text>
