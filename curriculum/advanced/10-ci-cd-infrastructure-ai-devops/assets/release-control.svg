<text x="1384.0" y="346.0" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600" fill="#16324F">deploy capability</text>
<rect x="1534" y="260" width="190" height="140" rx="14" fill="#EAF1FF" stroke="#2F6BFF" stroke-width="2"/>
<text x="1629.0" y="313.0" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600" fill="#16324F">Reviewed</text>
<text x="1629.0" y="335.0" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600" fill="#16324F">infrastructure as</text>
<text x="1629.0" y="357.0" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600" fill="#16324F">code</text>
<rect x="1779" y="270" width="190" height="120" rx="14" fill="#F0EEFF" stroke="#7667E8" stroke-width="2"/>
<text x="1874.0" y="324.0" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600" fill="#16324F">Canary</text>
<text x="1874.0" y="346.0" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600" fill="#16324F">verification</text>
<rect x="2024" y="250" width="190" height="160" rx="14" fill="#FFF1DF" stroke="#F59E42" stroke-width="2"/>
<text x="2119.0" y="324.0" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600" fill="#16324F">Promote or known-</text>
<text x="2119.0" y="346.0" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600" fill="#16324F">good rollback</text>
