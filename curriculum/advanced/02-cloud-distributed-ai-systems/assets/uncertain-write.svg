<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="620" viewBox="0 0 1600 620" role="img" aria-labelledby="title desc">
<title id="title">Why a lost response makes retries unsafe</title>
<desc id="desc">A client sends a request to a service, which commits state. The response is lost, so the client retries without knowing the first write succeeded, creating a duplicate effect.</desc>
<defs>
<marker id="arrow-primary" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#2F6BFF"/></marker>
<marker id="arrow-secondary" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#52606D"/></marker>
</defs>
<rect width="1600" height="620" fill="#F7F9FC"/>
<text x="64" y="64" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700" fill="#16324F">Why a lost response makes retries unsafe</text>
<text x="64" y="96" font-family="Inter, Arial, sans-serif" font-size="16" fill="#52606D">Trace an uncertain write from successful commit through response loss to a duplicate retry.</text>
<polyline points="262,300 326,300" fill="none" stroke="#2F6BFF" stroke-width="2.5" marker-end="url(#arrow-primary)" stroke-linejoin="round"/>
<polyline points="516,300 580,300" fill="none" stroke="#2F6BFF" stroke-width="2.5" marker-end="url(#arrow-primary)" stroke-linejoin="round"/>
<polyline points="770,300 834,300" fill="none" stroke="#52606D" stroke-width="2.5" stroke-dasharray="8 7" marker-end="url(#arrow-secondary)" stroke-linejoin="round"/>
<polyline points="1024,300 1088,300" fill="none" stroke="#52606D" stroke-width="2.5" stroke-dasharray="8 7" marker-end="url(#arrow-secondary)" stroke-linejoin="round"/>
<polyline points="1278,300 1342,300" fill="none" stroke="#2F6BFF" stroke-width="2.5" marker-end="url(#arrow-primary)" stroke-linejoin="round"/>
<rect x="72" y="250" width="190" height="100" rx="14" fill="#FFFFFF" stroke="#52606D" stroke-width="2"/>
<text x="167.0" y="305.0" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600" fill="#16324F">Client request</text>
<rect x="326" y="250" width="190" height="100" rx="14" fill="#EAF1FF" stroke="#2F6BFF" stroke-width="2"/>
<text x="421.0" y="294.0" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600" fill="#16324F">Service handles</text>
<text x="421.0" y="316.0" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600" fill="#16324F">write</text>
<rect x="580" y="250" width="190" height="100" rx="14" fill="#E5F7F6" stroke="#16A3A5" stroke-width="2"/>
<text x="675.0" y="305.0" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600" fill="#16324F">State committed</text>
<rect x="834" y="250" width="190" height="100" rx="14" fill="#FFF1DF" stroke="#F59E42" stroke-width="2"/>
<text x="929.0" y="305.0" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600" fill="#16324F">Response lost</text>
<rect x="1088" y="250" width="190" height="100" rx="14" fill="#FFFFFF" stroke="#52606D" stroke-width="2"/>
<text x="1183.0" y="305.0" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600" fill="#16324F">Client retries</text>
<rect x="1342" y="250" width="190" height="100" rx="14" fill="#FFF1DF" stroke="#F59E42" stroke-width="2"/>
<text x="1437.0" y="294.0" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600" fill="#16324F">Duplicate</text>
<text x="1437.0" y="316.0" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600" fill="#16324F">external effect</text>
</svg>
