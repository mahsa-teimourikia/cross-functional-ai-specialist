<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="780" viewBox="0 0 2000 780" role="img" aria-labelledby="title desc">
<title id="title">Durable distributed AI boundary</title>
<desc id="desc">An acceptance API durably enqueues work. A bounded worker calls a deterministic analyzer, conditionally commits operation and result state, reconciles unknown outcomes, and returns a terminal result. Classified failures follow a bounded retry and quarantine path.</desc>
<defs>
<marker id="arrow-primary" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#2F6BFF"/></marker>
<marker id="arrow-secondary" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#52606D"/></marker>
</defs>
<rect width="2000" height="780" fill="#F7F9FC"/>
<text x="64" y="64" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700" fill="#16324F">Durable distributed AI boundary</text>
<text x="64" y="96" font-family="Inter, Arial, sans-serif" font-size="16" fill="#52606D">Show bounded at-least-once work, conditional commit, reconciliation, and quarantine.</text>
<polyline points="262,285 330,285" fill="none" stroke="#2F6BFF" stroke-width="2.5" marker-end="url(#arrow-primary)" stroke-linejoin="round"/>
<polyline points="520,285 588,285" fill="none" stroke="#2F6BFF" stroke-width="2.5" marker-end="url(#arrow-primary)" stroke-linejoin="round"/>
<polyline points="778,285 846,285" fill="none" stroke="#2F6BFF" stroke-width="2.5" marker-end="url(#arrow-primary)" stroke-linejoin="round"/>
<polyline points="1036,285 1104,285" fill="none" stroke="#2F6BFF" stroke-width="2.5" marker-end="url(#arrow-primary)" stroke-linejoin="round"/>
<polyline points="1314,285 1382,285" fill="none" stroke="#2F6BFF" stroke-width="2.5" marker-end="url(#arrow-primary)" stroke-linejoin="round"/>
<polyline points="1572,285 1640,285" fill="none" stroke="#2F6BFF" stroke-width="2.5" marker-end="url(#arrow-primary)" stroke-linejoin="round"/>
<polyline points="683,340 683,520" fill="none" stroke="#52606D" stroke-width="2.5" stroke-dasharray="8 7" marker-end="url(#arrow-secondary)" stroke-linejoin="round"/>
<text x="683.0" y="418.0" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" fill="#334155">classified failure</text>
<polyline points="566,575 425,575 425,340" fill="none" stroke="#52606D" stroke-width="2.5" stroke-dasharray="8 7" marker-end="url(#arrow-secondary)" stroke-linejoin="round"/>
<text x="495.5" y="563.0" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" fill="#334155">within retry budget</text>
<rect x="72" y="230" width="190" height="110" rx="14" fill="#EAF1FF" stroke="#2F6BFF" stroke-width="2"/>
<text x="167.0" y="290.0" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600" fill="#16324F">Acceptance API</text>
<rect x="330" y="230" width="190" height="110" rx="14" fill="#E5F7F6" stroke="#16A3A5" stroke-width="2"/>
<text x="425.0" y="279.0" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600" fill="#16324F">Durable work</text>
<text x="425.0" y="301.0" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600" fill="#16324F">queue</text>
<rect x="588" y="230" width="190" height="110" rx="14" fill="#EAF1FF" stroke="#2F6BFF" stroke-width="2"/>
<text x="683.0" y="290.0" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600" fill="#16324F">Bounded worker</text>
<rect x="846" y="230" width="190" height="110" rx="14" fill="#F0EEFF" stroke="#7667E8" stroke-width="2"/>
<text x="941.0" y="279.0" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600" fill="#16324F">Deterministic</text>
<text x="941.0" y="301.0" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600" fill="#16324F">analyzer</text>
<rect x="1104" y="220" width="210" height="130" rx="14" fill="#E5F7F6" stroke="#16A3A5" stroke-width="2"/>
<text x="1209.0" y="268.0" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600" fill="#16324F">Conditional</text>
<text x="1209.0" y="290.0" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600" fill="#16324F">operation and</text>
<text x="1209.0" y="312.0" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600" fill="#16324F">result commit</text>
<rect x="1382" y="230" width="190" height="110" rx="14" fill="#FFF1DF" stroke="#F59E42" stroke-width="2"/>
<text x="1477.0" y="279.0" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600" fill="#16324F">Reconcile unknown</text>
<text x="1477.0" y="301.0" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600" fill="#16324F">outcome</text>
<rect x="1640" y="230" width="190" height="110" rx="14" fill="#EAF1FF" stroke="#2F6BFF" stroke-width="2"/>
<text x="1735.0" y="290.0" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600" fill="#16324F">Terminal result</text>
<rect x="566" y="520" width="234" height="110" rx="14" fill="#FFF1DF" stroke="#F59E42" stroke-width="2"/>
<text x="683.0" y="569.0" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600" fill="#16324F">Bounded retry or</text>
<text x="683.0" y="591.0" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600" fill="#16324F">quarantine</text>
</svg>
