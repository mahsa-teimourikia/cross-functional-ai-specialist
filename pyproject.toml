[project]
name = "cross-functional-ai-specialist-training"
version = "0.1.0"
description = "Executable advanced training for cross-functional AI specialists"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.10,<3",
]

[dependency-groups]
dev = [
  "ipykernel>=6.29",
  "mypy>=1.15",
  "nbclient>=0.10",
  "nbformat>=5.10",
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "ruff>=0.11",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
files = ["curriculum/advanced/01-production-ai-development/lab.py"]
