<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cross-Functional AI Specialist — Knowledge Check</title>
    <link rel="stylesheet" href="styles.css" />

  <body>
    <header>
      <a href="../hub/index.html">← Learning Hub</a>

    </main>
    <script src="quiz.js"></script>
